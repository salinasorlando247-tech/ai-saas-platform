services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    restart: always

  frontend:
    image: nginx:alpine
    volumes:
      - ./Frontend:/usr/share/nginx/html
    ports:
      - "80:80"
    restart: always
