version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodetest-backend
    ports:
      - "5000:5000"
    environment:
      - STRIPE_SECRET_KEY=your_stripe_secret_here
    volumes:
      - ./Backend/uploads:/app/uploads
      - ./Backend/output_videos:/app/output_videos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nodetest-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
